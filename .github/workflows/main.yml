name: Update Cat Train

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/main.yml"
      - "generate_snake.py"
      - "test_generate_snake.py"
      - "*.png"
  schedule:
    - cron: "5 15 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install Pillow requests

      - name: Run pathfinding tests
        run: python -m unittest -v

      - name: Generate Cat Snake GIF
        run: python generate_snake.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TZ: Asia/Seoul

      - name: Commit and Push
        run: |
          commit_date="$(TZ=Asia/Seoul date '+%Y-%m-%dT%H:%M:%S%z')"
          git config --global user.name "mmporong"
          git config --global user.email "74720422+mmporong@users.noreply.github.com"
          git add cat-snake.gif
          GIT_AUTHOR_DATE="$commit_date" GIT_COMMITTER_DATE="$commit_date" git commit -m "chore: real snake logic applied 🐾" || exit 0
          git push
